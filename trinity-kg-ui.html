<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trinity Knowledge Graph</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root{--bg:#000;--accent:#00E599;--accent-dim:rgba(0,229,153,0.15);--text:#FFF;--muted:#888;--border:rgba(255,255,255,0.08);--card:rgba(255,255,255,0.03)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
    #quantum-bg{position:fixed;inset:0;z-index:-1;opacity:0.5}
    header{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(0,0,0,0.7);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:1000}
    .logo{display:flex;align-items:center;gap:12px;font-weight:600;font-size:1.1rem}
    .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#00B377);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .sacred{font-family:serif;color:var(--accent);font-size:0.75rem;opacity:0.8;margin-left:12px;letter-spacing:2px}
    .stats-bar{display:flex;gap:20px;font-size:0.8rem}
    .stat{color:var(--muted)}.stat-value{color:var(--accent);font-weight:600;margin-left:4px}
    nav{display:flex;gap:8px;margin-left:auto;margin-right:20px}
    nav a{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:999px;color:var(--muted);text-decoration:none;font-size:0.8rem;transition:all 0.3s}
    nav a:hover,nav a.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
    #panel{position:fixed;top:60px;left:0;width:300px;height:calc(100vh - 60px);background:rgba(0,0,0,0.5);backdrop-filter:blur(20px);border-right:1px solid var(--border);padding:20px;overflow-y:auto;z-index:100;transition:transform 0.3s}
    #panel.collapsed{transform:translateX(-300px)}
    .panel-toggle{position:fixed;top:80px;left:300px;width:28px;height:56px;background:rgba(0,0,0,0.7);border:1px solid var(--border);border-left:none;border-radius:0 12px 12px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:all 0.3s;z-index:101;font-size:14px}
    .panel-toggle:hover{color:var(--accent);background:var(--accent-dim)}
    #panel.collapsed+.panel-toggle{left:0}
    .section{margin-bottom:20px}
    .section-title{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .section-title::after{content:'';flex:1;height:1px;background:var(--border)}
    input{width:100%;padding:11px 14px;margin-bottom:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:0.85rem;transition:all 0.2s}
    input:focus{outline:none;border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 20px rgba(0,229,153,0.1)}
    input::placeholder{color:#444}
    .btn{width:100%;padding:11px 16px;margin-bottom:8px;background:var(--text);color:var(--bg);border:none;border-radius:999px;font-family:inherit;font-size:0.85rem;font-weight:500;cursor:pointer;transition:all 0.3s}
    .btn:hover{background:var(--accent);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,229,153,0.3)}
    .btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
    .btn-secondary:hover{background:var(--accent-dim);border-color:var(--accent)}
    .btn-small{padding:8px 12px;font-size:0.75rem;border-radius:8px}
    .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn-grid .btn{margin-bottom:0}
    .examples{display:flex;flex-direction:column;gap:6px}
    .example-btn{padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:0.75rem;text-align:left;cursor:pointer;transition:all 0.2s}
    .example-btn:hover{border-color:var(--accent);background:var(--accent-dim);transform:translateX(4px)}
    .coptic-formula{background:linear-gradient(135deg,rgba(0,229,153,0.05),rgba(0,179,119,0.05));border:1px solid rgba(0,229,153,0.2);border-radius:12px;padding:16px;margin-top:16px;text-align:center}
    .coptic-text{font-family:'Times New Roman',serif;font-size:1.4rem;color:var(--accent);letter-spacing:3px;margin-bottom:8px;text-shadow:0 0 20px rgba(0,229,153,0.5)}
    .coptic-sub{font-size:0.65rem;color:var(--muted);letter-spacing:1px}
    .zoom-controls{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:100}
    .zoom-btn{width:40px;height:40px;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:18px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center}
    .zoom-btn:hover{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
    #tooltip{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);padding:16px 28px;border-radius:16px;border:1px solid var(--accent);box-shadow:0 8px 40px rgba(0,229,153,0.2);max-width:500px;text-align:center;z-index:200;opacity:0;transition:all 0.4s}
    #tooltip.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #tooltip .title{font-weight:600;color:var(--accent);margin-bottom:6px}
    #tooltip .content{color:var(--muted);font-size:0.8rem}
    #graph-container{position:fixed;top:60px;left:300px;right:0;bottom:0;transition:left 0.3s;cursor:grab}
    #graph-container:active{cursor:grabbing}
    #panel.collapsed~#graph-container{left:0}
    svg{width:100%;height:100%}
    .node circle{stroke:var(--bg);stroke-width:2px;cursor:pointer;transition:all 0.3s}
    .node text{font-family:'Outfit',sans-serif;font-size:10px;fill:var(--text);pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,0.9)}
    .node.entity circle{fill:var(--accent)}
    .node.value circle{fill:#3B82F6}
    .node.highlighted circle{stroke:var(--text);stroke-width:3px;filter:drop-shadow(0 0 25px var(--accent))}
    .node.dimmed{opacity:0.1}
    .node:hover circle{filter:drop-shadow(0 0 15px var(--accent));transform:scale(1.15)}
    .link{stroke:rgba(255,255,255,0.08);stroke-width:1.5px;transition:all 0.3s}
    .link.highlighted{stroke:var(--accent);stroke-width:3px;filter:drop-shadow(0 0 10px var(--accent))}
    .link.dimmed{opacity:0.03}
    .link-label{font-family:'Outfit',sans-serif;font-size:8px;fill:var(--muted);pointer-events:none}
    .link-label.highlighted{fill:var(--accent);font-weight:500}
    .link-label.dimmed{opacity:0.05}
    @media(max-width:768px){#panel{width:100%;transform:translateX(-100%)}.panel-toggle{left:0}#graph-container{left:0}.stats-bar{display:none}.sacred{display:none}}
  </style>
</head>
<body>
  <canvas id="quantum-bg"></canvas>
  <header>
    <div class="logo">
      <div class="logo-icon">◬</div>
      <span>Trinity KG</span>
      <span class="sacred">ⲫⲱⲥ · ⲗⲟⲅⲟⲥ · ⲍⲱⲏ</span>
    </div>
    <nav>
      <a href="/" class="active">Knowledge Graph</a>
      <a href="/stars">Star Map</a>
    </nav>
    <div class="stats-bar">
      <div class="stat">Entities<span class="stat-value" id="stat-entities">0</span></div>
      <div class="stat">Relations<span class="stat-value" id="stat-relations">0</span></div>
      <div class="stat">Triples<span class="stat-value" id="stat-triples">0</span></div>
    </div>
  </header>
  <div id="panel">
    <div class="section"><div class="section-title">Add Triple</div>
      <input id="subject" placeholder="Subject"><input id="predicate" placeholder="Predicate"><input id="object" placeholder="Object">
      <button class="btn" onclick="addTriple()">Add Triple</button>
    </div>
    <div class="section"><div class="section-title">Find Path</div>
      <input id="fromEntity" placeholder="From entity"><input id="toEntity" placeholder="To entity">
      <button class="btn" onclick="findPath()">Find Path</button>
    </div>
    <div class="section"><div class="section-title">Examples</div>
      <div class="examples">
        <button class="example-btn" onclick="runExample('Socrates','mortal')">ⲥⲱⲕⲣⲁⲧⲏⲥ → Is Socrates mortal?</button>
        <button class="example-btn" onclick="runExample('Socrates','Aristotle')">ⲥⲱⲕⲣⲁⲧⲏⲥ → ⲁⲣⲓⲥⲧⲟⲧⲉⲗⲏⲥ</button>
        <button class="example-btn" onclick="runExample('VIBEE','Zig')">ⲃⲓⲃⲉⲉ → Zig</button>
      </div>
    </div>
    <div class="section"><div class="section-title">Actions</div>
      <div class="btn-grid">
        <button class="btn btn-secondary btn-small" onclick="loadGraph()">Refresh</button>
        <button class="btn btn-secondary btn-small" onclick="clearGraph()">Clear</button>
        <button class="btn btn-secondary btn-small" onclick="resetZoom()">Reset View</button>
        <button class="btn btn-secondary btn-small" onclick="fitGraph()">Fit All</button>
      </div>
    </div>
    <div class="section"><div class="section-title">Akashic Records</div>
      <div class="coptic-formula">
        <div class="coptic-text">φ² + 1/φ² = 3</div>
        <div class="coptic-sub">ⲧⲣⲓⲁⲥ ⲁⲅⲓⲁ · GOLDEN IDENTITY</div>
      </div>
      <div class="coptic-formula" style="margin-top:8px">
        <div class="coptic-text" id="akashic-phi">φ = 1.618</div>
        <div class="coptic-sub">L(10) = <span id="akashic-lucas">123</span></div>
      </div>
      <button class="btn btn-secondary btn-small" style="margin-top:8px" onclick="loadAkashic()">Load Akashic</button>
    </div>
  </div>
  <div class="panel-toggle" onclick="togglePanel()">‹</div>
  <div id="graph-container"><svg id="graph"></svg></div>
  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomIn()">+</button>
    <button class="zoom-btn" onclick="zoomOut()">−</button>
    <button class="zoom-btn" onclick="resetZoom()">⟲</button>
  </div>
  <div id="tooltip"><div class="title"></div><div class="content"></div></div>
<script>
const API='';let graphData={nodes:[],links:[]},simulation,svg,g,linkGroup,linkLabelGroup,nodeGroup,zoom;
(function(){const c=document.getElementById('quantum-bg'),x=c.getContext('2d');let p=[],mx=-1e3,my=-1e3;
function r(){c.width=innerWidth;c.height=innerHeight;p=[];for(let i=0;i<Math.min(60,c.width/25);i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*2+.5});}
function a(){x.clearRect(0,0,c.width,c.height);for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){const dx=p[j].x-p[i].x,dy=p[j].y-p[i].y,d=Math.sqrt(dx*dx+dy*dy);if(d<150){x.beginPath();x.moveTo(p[i].x,p[i].y);x.lineTo(p[j].x,p[j].y);x.strokeStyle=`rgba(0,229,153,${(1-d/150)*.12})`;x.lineWidth=.5;x.stroke();}}
p.forEach(q=>{const dx=mx-q.x,dy=my-q.y,d=Math.sqrt(dx*dx+dy*dy);if(d<180&&d>0){const f=(1-d/180)*.6;q.vx-=(dx/d)*f;q.vy-=(dy/d)*f;}q.x+=q.vx;q.y+=q.vy;q.vx*=.99;q.vy*=.99;if(q.x<0)q.x=c.width;if(q.x>c.width)q.x=0;if(q.y<0)q.y=c.height;if(q.y>c.height)q.y=0;x.beginPath();x.arc(q.x,q.y,q.r,0,Math.PI*2);x.fillStyle='rgba(255,255,255,.4)';x.fill();});requestAnimationFrame(a);}
r();addEventListener('resize',r);document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});a();})();
function togglePanel(){const p=document.getElementById('panel');p.classList.toggle('collapsed');document.querySelector('.panel-toggle').textContent=p.classList.contains('collapsed')?'›':'‹';}
document.addEventListener('DOMContentLoaded',()=>{initSVG();loadGraph();});
function initSVG(){svg=d3.select('#graph');g=svg.append('g');linkGroup=g.append('g');linkLabelGroup=g.append('g');nodeGroup=g.append('g');
zoom=d3.zoom().scaleExtent([0.1,4]).on('zoom',e=>g.attr('transform',e.transform));
svg.call(zoom);svg.on('dblclick.zoom',null);
svg.on('click',e=>{if(e.target.tagName==='svg'){clearHighlight();hideTooltip();}});}
function zoomIn(){svg.transition().duration(300).call(zoom.scaleBy,1.5);}
function zoomOut(){svg.transition().duration(300).call(zoom.scaleBy,0.67);}
function resetZoom(){svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);}
function fitGraph(){if(!graphData.nodes.length)return;const c=document.getElementById('graph-container'),w=c.clientWidth,h=c.clientHeight;let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;graphData.nodes.forEach(n=>{if(n.x<minX)minX=n.x;if(n.x>maxX)maxX=n.x;if(n.y<minY)minY=n.y;if(n.y>maxY)maxY=n.y;});const gw=maxX-minX+100,gh=maxY-minY+100,s=Math.min(w/gw,h/gh,2)*0.9,cx=(minX+maxX)/2,cy=(minY+maxY)/2;svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(w/2-cx*s,h/2-cy*s).scale(s));}
async function loadGraph(){try{const[gr,st]=await Promise.all([fetch(API+'/api/graph'),fetch(API+'/api/stats')]);const graph=await gr.json(),stats=await st.json();document.getElementById('stat-entities').textContent=stats.entities;document.getElementById('stat-relations').textContent=stats.relations;document.getElementById('stat-triples').textContent=stats.triples;graphData=graph;renderGraph();hideTooltip();}catch(e){console.error(e);}}
function renderGraph(){const c=document.getElementById('graph-container'),w=c.clientWidth,h=c.clientHeight;linkGroup.selectAll('*').remove();linkLabelGroup.selectAll('*').remove();nodeGroup.selectAll('*').remove();if(!graphData.nodes.length)return;
simulation=d3.forceSimulation(graphData.nodes).force('link',d3.forceLink(graphData.links).id(d=>d.id).distance(100)).force('charge',d3.forceManyBody().strength(-350)).force('center',d3.forceCenter(w/2,h/2)).force('collision',d3.forceCollide().radius(35));
const links=linkGroup.selectAll('line').data(graphData.links).enter().append('line').attr('class','link');
const labels=linkLabelGroup.selectAll('text').data(graphData.links).enter().append('text').attr('class','link-label').text(d=>d.label);
const nodes=nodeGroup.selectAll('g').data(graphData.nodes).enter().append('g').attr('class',d=>`node ${d.group===2?'value':'entity'}`).call(d3.drag().on('start',ds).on('drag',dr).on('end',de)).on('click',(e,d)=>{e.stopPropagation();highlightConnections(d.id);});
nodes.append('circle').attr('r',16);nodes.append('text').attr('dy',28).attr('text-anchor','middle').text(d=>d.id);
simulation.on('tick',()=>{links.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);labels.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2);nodes.attr('transform',d=>`translate(${d.x},${d.y})`);});}
function ds(e){if(!e.active)simulation.alphaTarget(.3).restart();e.subject.fx=e.subject.x;e.subject.fy=e.subject.y;}
function dr(e){e.subject.fx=e.x;e.subject.fy=e.y;}
function de(e){if(!e.active)simulation.alphaTarget(0);e.subject.fx=null;e.subject.fy=null;}
function highlightConnections(id){clearHighlight();const conn=new Set([id]),li=[];graphData.links.forEach((l,i)=>{const s=typeof l.source==='object'?l.source.id:l.source,t=typeof l.target==='object'?l.target.id:l.target;if(s===id||t===id){conn.add(s);conn.add(t);li.push(i);}});nodeGroup.selectAll('.node').classed('highlighted',d=>d.id===id).classed('dimmed',d=>!conn.has(d.id));linkGroup.selectAll('line').classed('highlighted',(d,i)=>li.includes(i)).classed('dimmed',(d,i)=>!li.includes(i));linkLabelGroup.selectAll('text').classed('highlighted',(d,i)=>li.includes(i)).classed('dimmed',(d,i)=>!li.includes(i));const o=[],n=[];graphData.links.forEach(l=>{const s=typeof l.source==='object'?l.source.id:l.source,t=typeof l.target==='object'?l.target.id:l.target;if(s===id)o.push(`${l.label} → ${t}`);if(t===id)n.push(`${s} → ${l.label}`);});showTooltip(id,(o.concat(n)).join(', ')||'ⲟⲩⲇⲉⲛ - No connections');}
function clearHighlight(){nodeGroup.selectAll('.node').classed('highlighted',false).classed('dimmed',false);linkGroup.selectAll('line').classed('highlighted',false).classed('dimmed',false);linkLabelGroup.selectAll('text').classed('highlighted',false).classed('dimmed',false);}
async function findPath(){const f=document.getElementById('fromEntity').value.trim(),t=document.getElementById('toEntity').value.trim();if(!f||!t){alert('ⲡⲗⲏⲣⲱⲥⲟⲛ - Fill both fields');return;}try{const r=await fetch(`${API}/api/reason?from=${encodeURIComponent(f)}&to=${encodeURIComponent(t)}`);const d=await r.json();if(!d.found){showTooltip('ⲟⲩⲇⲉⲛ ϩⲓⲏ',`Cannot reach "${t}" from "${f}"`);clearHighlight();return;}const pn=new Set([f]),pl=[];d.path.forEach(s=>{pn.add(s.entity);pn.add(s.next);});graphData.links.forEach((l,i)=>{const s=typeof l.source==='object'?l.source.id:l.source,t=typeof l.target==='object'?l.target.id:l.target;d.path.forEach(st=>{if(s===st.entity&&t===st.next)pl.push(i);});});clearHighlight();nodeGroup.selectAll('.node').classed('highlighted',n=>pn.has(n.id)).classed('dimmed',n=>!pn.has(n.id));linkGroup.selectAll('line').classed('highlighted',(l,i)=>pl.includes(i)).classed('dimmed',(l,i)=>!pl.includes(i));linkLabelGroup.selectAll('text').classed('highlighted',(l,i)=>pl.includes(i)).classed('dimmed',(l,i)=>!pl.includes(i));showTooltip(`ϩⲓⲏ ϩⲛ ${d.hops} ⲃⲏⲙⲁ`,d.conclusion);}catch(e){alert(e.message);}}
function runExample(f,t){document.getElementById('fromEntity').value=f;document.getElementById('toEntity').value=t;findPath();}
async function addTriple(){const s=document.getElementById('subject').value.trim(),p=document.getElementById('predicate').value.trim(),o=document.getElementById('object').value.trim();if(!s||!p||!o){alert('ⲡⲗⲏⲣⲱⲥⲟⲛ');return;}await fetch(`${API}/api/add`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:s,predicate:p,object:o})});document.getElementById('subject').value='';document.getElementById('predicate').value='';document.getElementById('object').value='';loadGraph();}
function clearGraph(){if(confirm('ⲕⲁⲑⲁⲣⲓⲍⲉ ⲡⲧⲏⲣϥ - Clear all?'))fetch(`${API}/api/clear`,{method:'POST'}).then(loadGraph);}
async function loadAkashic(){try{const r=await fetch(API+'/api/akashic');const a=await r.json();document.getElementById('akashic-phi').textContent=`φ = ${a.phi.toFixed(6)}`;document.getElementById('akashic-lucas').textContent=a.lucas_10;showTooltip('ⲁⲕⲁϣⲓⲕ',`Trinity: ${a.trinity.toFixed(3)} | 1/α: ${a.fine_structure_inv.toFixed(3)} | π×φ×e: ${a.transcendental.toFixed(2)}`);}catch(e){console.error(e);}}
function showTooltip(t,c){const e=document.getElementById('tooltip');e.querySelector('.title').textContent=t;e.querySelector('.content').innerHTML=c;e.classList.add('show');}
function hideTooltip(){document.getElementById('tooltip').classList.remove('show');}
</script>
</body>
</html>
